[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "argus"
version = "0.1.0"
description = "Deterministic security enforcement layer for AI agents"
requires-python = ">=3.12"
license = {text = "Apache-2.0"}
dependencies = [
    "casbin>=1.43.0",
    "cryptography>=42.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "tenacity>=8.0",
    "circuitbreaker>=2.0",
    "litellm>=1.0",
    "aiosqlite>=0.22.0",
    "opentelemetry-api>=1.20",
    "opentelemetry-sdk>=1.20",
    "typer[all]>=0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio==0.24.0",
]
langchain = [
    "langchain-core>=1.2.5",
]

[project.scripts]
argus = "argus.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["argus"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["error::DeprecationWarning"]
markers = [
    "integration: marks tests that require live API keys (deselect with '-m \"not integration\"')",
]
